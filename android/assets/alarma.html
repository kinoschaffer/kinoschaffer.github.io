<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Alarma</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{display:flex;justify-content:center;min-height:100vh;user-select:none;-webkit-user-select:none}
.wrap{width:100%;max-width:480px}
.clock{text-align:center;margin:4px 0 8px}
.clock .val{font-size:clamp(40px,15vw,64px)!important;padding:2px 14px!important;min-width:0!important}
.clock .date{margin-top:4px;font-size:13px}
.next{text-align:center;margin-bottom:8px;font-size:13px;min-height:18px}
.list{background:#fff;min-height:120px;max-height:50vh;overflow:auto;padding:2px;
  box-shadow:inset -1px -1px #fff,inset 1px 1px #808080,inset -2px -2px #dfdfdf,inset 2px 2px #0a0a0a}
.al{display:flex;align-items:center;gap:8px;padding:8px 6px;border-bottom:1px dotted #808080}
.al.off .t,.al.off .d{color:#808080}
.al .t{font-size:30px;font-weight:bold;font-family:"Courier New",monospace!important;min-width:100px}
.al .info{flex:1;min-width:0}
.al .d{font-size:12px}
.al .lb{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al button{min-width:0!important;padding:4px 8px!important}
.empty{color:#808080;text-align:center;padding:30px 10px}
.chk{width:22px;height:22px;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;flex:none;
  box-shadow:inset -1px -1px #fff,inset 1px 1px #808080,inset -2px -2px #dfdfdf,inset 2px 2px #0a0a0a}
.bar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.warn{background:#ffffe1;border:1px solid #000;padding:6px 8px;margin-bottom:8px;font-size:12px;display:none}
.warn button{margin-top:6px;padding:3px 8px!important;min-width:0!important}
.field{margin:8px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.field label{min-width:70px}
input[type=time]{font-size:28px;font-family:"Courier New",monospace!important;padding:2px 6px;background:#fff;border:none;
  box-shadow:inset -1px -1px #fff,inset 1px 1px #808080,inset -2px -2px #dfdfdf,inset 2px 2px #0a0a0a}
input[type=text],select{font-size:14px;padding:4px;background:#fff;border:none;flex:1;min-width:0;
  box-shadow:inset -1px -1px #fff,inset 1px 1px #808080,inset -2px -2px #dfdfdf,inset 2px 2px #0a0a0a}
.days{display:flex;gap:3px}
.days button{min-width:0!important;width:34px;padding:6px 0!important}
.days button.on{font-weight:bold!important;background:#000080!important;color:#fff!important}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.overlay.show{display:flex}
.modal{max-width:360px;width:100%;text-align:left!important}
.overlay{background:rgba(0,0,0,.3)!important}
</style>
<link rel="stylesheet" href="win98.css">
</head>
<body data-icon="⏰">
<div class="wrap">
  <div class="warn" id="warn"></div>
  <div class="clock"><span class="val" id="now">--:--</span><div class="date" id="date"></div></div>
  <div class="next" id="next"></div>
  <div class="list" id="list"></div>
  <div class="bar">
    <button id="btnAdd">➕ Nueva alarma</button>
    <button id="btnTest">🔔 Probar</button>
  </div>
  <div class="w98-status"><div id="st">Listo</div><div id="cnt" style="flex:0 0 auto"></div></div>
</div>

<div class="overlay" id="dlg"><div class="modal">
  <h2 id="dlgT">Nueva alarma</h2>
  <div class="field" style="justify-content:center"><input type="time" id="fTime" value="07:00"></div>
  <div class="field"><label>Repetir:</label><div class="days" id="fDays"></div></div>
  <div class="field"><label>Nombre:</label><input type="text" id="fLabel" maxlength="40" placeholder="Alarma"></div>
  <div class="field"><label>Posponer:</label><select id="fSnooze"><option>5</option><option selected>10</option><option>15</option><option>20</option><option>30</option></select> min</div>
  <div class="field"><label>Sonido:</label><select id="fSound"></select><button id="fPlay" style="min-width:0!important;padding:4px 10px!important">▶</button></div>
  <div class="field"><label>Volumen:</label><input type="range" id="fVol" min="10" max="100" step="10" value="80" style="flex:1"><span id="fVolT" style="width:40px">80%</span></div>
  <div class="field"><label>Vibrar:</label><select id="fVib"><option value="1">Sí</option><option value="0">No</option></select></div>
  <div class="bar"><button id="dOk">Aceptar</button><button id="dCancel">Cancelar</button><button id="dDel">Eliminar</button></div>
</div></div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const DN=['L','M','X','J','V','S','D'], DL=['lun','mar','mié','jue','vie','sáb','dom'];
const N=window.AlarmaNativa||null;
let alarms=[], editing=null, custom=null, playing=false;
const BUILTIN=[['clasico','Clásico 98'],['campanas','Campanas'],['digital','Reloj digital'],['sirena','Sirena']];
const rawUri=n=>N?N.rawSound(n):'raw:'+n;
function fillSounds(sel,name){
  const o=[['','Predeterminado del teléfono']].concat(BUILTIN.map(([k,t])=>[rawUri(k),t+' (app)']));
  if(custom)o.push([custom.uri,'♪ '+custom.name]);
  o.push(['#tono','Elegir tono del teléfono…'],['#archivo','Elegir archivo de música…']);
  $('fSound').innerHTML=o.map(([v,t])=>`<option value="${esc(v)}">${esc(t)}</option>`).join('');
  $('fSound').value=sel;$('fSound').dataset.prev=sel;
}
function soundName(a){
  if(!a.sound)return 'Predeterminado';
  const b=BUILTIN.find(([k])=>a.sound===rawUri(k)); if(b)return b[1];
  return a.soundName||'Personalizado';
}
window.onSonidoElegido=(uri,name)=>{custom={uri,name};fillSounds(uri);};
const pad=n=>String(n).padStart(2,'0');

function load(){
  try{alarms=JSON.parse(N?N.getAlarms():(localStorage.getItem('alarms')||'[]'))}catch(e){alarms=[]}
}
function store(){
  const j=JSON.stringify(alarms);
  if(N){N.saveAlarms(j);}else{try{localStorage.setItem('alarms',j)}catch(e){}}
  render();
}
function daysText(m){
  if(!m)return 'Una vez'; if(m===127)return 'Todos los días'; if(m===31)return 'Lunes a viernes'; if(m===96)return 'Fines de semana';
  return DL.filter((_,i)=>m&(1<<i)).join(', ');
}
function nextTime(a,from){ // Date of next ring
  for(let d=0;d<8;d++){const t=new Date(from);t.setDate(t.getDate()+d);t.setHours(a.h,a.m,0,0);
    if(t<=from)continue; const idx=(t.getDay()+6)%7; if(!a.days||(a.days&(1<<idx)))return t;}
  return null;
}
function render(){
  alarms.sort((a,b)=>a.h*60+a.m-(b.h*60+b.m));
  const L=$('list');
  if(!alarms.length)L.innerHTML='<div class="empty">No hay alarmas.<br>Pulsa «Nueva alarma».</div>';
  else L.innerHTML=alarms.map((a,i)=>`<div class="al ${a.on?'':'off'}">
    <div class="chk" data-t="${i}">${a.on?'✔':''}</div>
    <div class="t" data-e="${i}">${pad(a.h)}:${pad(a.m)}</div>
    <div class="info" data-e="${i}"><div class="lb">${esc(a.label||'Alarma')}</div><div class="d">${daysText(a.days)} · 🔊 ${esc(soundName(a))}</div></div>
    <button data-e="${i}">✎</button></div>`).join('');
  $('cnt').textContent=alarms.filter(a=>a.on).length+' activa(s)';
  tick();
}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function tick(){
  const now=new Date();
  $('now').textContent=pad(now.getHours())+':'+pad(now.getMinutes());
  $('date').textContent=now.toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'});
  let best=null;for(const a of alarms)if(a.on){const t=nextTime(a,now);if(t&&(!best||t<best))best=t;}
  if(best){const mins=Math.round((best-now)/60000),d=Math.floor(mins/1440),h=Math.floor(mins%1440/60),m=mins%60;
    $('next').textContent='⏰ Próxima alarma en '+(d?d+' d ':'')+(h?h+' h ':'')+(d?'':m+' min');}
  else $('next').textContent='Sin alarmas activas';
}
$('list').addEventListener('click',e=>{
  const t=e.target.closest('[data-t]'),ed=e.target.closest('[data-e]');
  if(t){const a=alarms[+t.dataset.t];a.on=!a.on;store();say(a.on?'Alarma activada':'Alarma desactivada');}
  else if(ed)openDlg(+ed.dataset.e);
});
$('fDays').innerHTML=DN.map((d,i)=>`<button data-i="${i}">${d}</button>`).join('');
$('fDays').addEventListener('click',e=>{const b=e.target.closest('button');if(b)b.classList.toggle('on')});
function openDlg(i){
  editing=i; const a=i==null?{h:7,m:0,days:0,label:'',snooze:10,vib:true,sound:'',vol:80}:alarms[i];
  custom=(a.sound&&!BUILTIN.some(([k])=>a.sound===rawUri(k)))?{uri:a.sound,name:a.soundName||'Personalizado'}:null;
  fillSounds(a.sound||''); $('fVol').value=a.vol||80; $('fVolT').textContent=(a.vol||80)+'%';
  $('dlgT').textContent=i==null?'Nueva alarma':'Editar alarma';
  $('fTime').value=pad(a.h)+':'+pad(a.m); $('fLabel').value=a.label||''; $('fSnooze').value=String(a.snooze); $('fVib').value=a.vib===false?'0':'1';
  [...$('fDays').children].forEach((b,k)=>b.classList.toggle('on',!!(a.days&(1<<k))));
  $('dDel').style.display=i==null?'none':''; $('dlg').classList.add('show');
}
$('btnAdd').onclick=()=>{askPerms();openDlg(null)};
function stopPlay(){if(playing&&N)N.stopPreview();playing=false;$('fPlay').textContent='▶';}
$('dCancel').onclick=()=>{stopPlay();$('dlg').classList.remove('show');};
$('fSound').onchange=()=>{const v=$('fSound').value;stopPlay();
  if(v==='#tono'||v==='#archivo'){$('fSound').value=$('fSound').dataset.prev||'';
    if(N)N.pickSound(v.slice(1),$('fSound').value);else say('Disponible solo en la app Android');}
  else $('fSound').dataset.prev=v;};
$('fPlay').onclick=()=>{if(!N){say('Disponible solo en la app Android');return;}
  if(playing){stopPlay();return;} N.preview($('fSound').value,+$('fVol').value);playing=true;$('fPlay').textContent='■';
  setTimeout(()=>{if(playing){playing=false;$('fPlay').textContent='▶';}},6000);};
$('fVol').oninput=()=>{$('fVolT').textContent=$('fVol').value+'%';};
$('dDel').onclick=()=>{stopPlay();alarms.splice(editing,1);$('dlg').classList.remove('show');store();say('Alarma eliminada');};
$('dOk').onclick=()=>{
  const [h,m]=($('fTime').value||'07:00').split(':').map(Number);
  let days=0;[...$('fDays').children].forEach((b,k)=>{if(b.classList.contains('on'))days|=1<<k});
  stopPlay(); const snd=$('fSound').value;
  const a={id:editing==null?Date.now()%1000000000:alarms[editing].id,h,m,days,label:$('fLabel').value.trim(),snooze:+$('fSnooze').value,vib:$('fVib').value==='1',on:true,
    sound:snd,soundName:(custom&&custom.uri===snd)?custom.name:'',vol:+$('fVol').value};
  if(editing==null)alarms.push(a);else alarms[editing]=a;
  $('dlg').classList.remove('show');store();
  const t=nextTime(a,new Date()),mins=Math.round((t-new Date())/60000);
  say('Sonará en '+(mins>=60?Math.floor(mins/60)+' h ':'')+(mins%60)+' min');
};
$('btnTest').onclick=()=>{if(N){askPerms();N.test();say('Sonará en 5 segundos…');}else say('Disponible solo en la app Android');};
let stT;function say(t){$('st').textContent=t;clearTimeout(stT);stT=setTimeout(()=>$('st').textContent='Listo',4000);}
function askPerms(){if(N)N.requestPermissions();}
function checkPerms(){
  const w=$('warn');
  if(!N){w.style.display='block';w.innerHTML='⚠ Esta alarma solo suena en la <b>app Android</b>. En el navegador puedes ver la pantalla, pero no sonará.';return;}
  let st={};try{st=JSON.parse(N.status())}catch(e){}
  const msgs=[];
  if(st.notif===false)msgs.push(['Las notificaciones están desactivadas.','notif']);
  if(st.exact===false)msgs.push(['Falta el permiso de «Alarmas y recordatorios».','exact']);
  if(st.fullscreen===false)msgs.push(['Falta el permiso para mostrar la alarma a pantalla completa.','fullscreen']);
  if(st.battery===false)msgs.push(['Recomendado: quitar la optimización de batería para que la alarma no se retrase.','battery']);
  w.style.display=msgs.length?'block':'none';
  w.innerHTML=msgs.map(([t,k])=>`<div>⚠ ${t} <button data-fix="${k}">Arreglar</button></div>`).join('');
}
$('warn').addEventListener('click',e=>{const b=e.target.closest('[data-fix]');if(b&&N)N.fix(b.dataset.fix);});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){load();render();checkPerms();}});
window.onAlarmasCambiadas=()=>{load();render();};
load();render();checkPerms();askPerms();
setInterval(tick,5000);
})();
</script>
<script src="win98.js"></script>
</body>
</html>
