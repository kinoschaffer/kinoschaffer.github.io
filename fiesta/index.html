<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1e0b3a">
<title>Fiesta Tablero</title>
<style>
:root{
  --bg:#1e0b3a;--bg2:#2d1457;--card:#3a1d6e;--txt:#fff;--mut:#c9b8ee;
  --blue:#3b82f6;--red:#ef4444;--ev:#a855f7;--start:#22c55e;--gold:#fcc419;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:radial-gradient(circle at 50% 0,#4b1f8f,var(--bg) 70%) fixed;color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#app{max-width:520px;margin:0 auto;padding:12px 12px 32px;min-height:100%}
h1{margin:8px 0 4px;font-size:2rem;text-align:center}
h2{margin:6px 0 10px;text-align:center}
.sub{color:var(--mut);text-align:center;margin:0 0 16px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 6px 20px #0006}
label{display:block;font-weight:700;margin:10px 0 6px}
input{width:100%;font-size:1.2rem;padding:12px;border-radius:12px;border:2px solid #6d4bb3;background:#1c0b36;color:#fff;outline:none;user-select:text;-webkit-user-select:text}
input:focus{border-color:var(--gold)}
.codeinput{text-transform:uppercase;text-align:center;letter-spacing:.4em;font-weight:800;font-size:1.6rem}
button{font:inherit;font-weight:800;border:0;border-radius:14px;padding:14px;width:100%;cursor:pointer;color:#1e0b3a;background:var(--gold);
  box-shadow:0 4px 0 #b8860b;margin-top:10px;font-size:1.1rem;touch-action:manipulation}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #b8860b}
button.sec{background:#7c5cc4;color:#fff;box-shadow:0 4px 0 #4c3388}
button.no{background:#64748b;color:#fff;box-shadow:0 4px 0 #334155}
button:disabled{opacity:.45}
.big{font-size:1.4rem;padding:18px}
.or{text-align:center;color:var(--mut);margin:16px 0 6px}
.err{color:#ff8fa3;text-align:center;font-weight:700;min-height:1.2em}
.emojis{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.emojis button{font-size:1.6rem;padding:6px;margin:0;background:#1c0b36;box-shadow:none;border:2px solid transparent}
.emojis button.sel{border-color:var(--gold);background:#4b2a86}
.codebig{font-size:3rem;font-weight:900;letter-spacing:.3em;text-align:center;color:var(--gold);margin:4px 0}
.row{display:flex;gap:8px}
.row>*{flex:1}
.pl{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:#24104a;margin-top:6px}
.pl .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:1.3rem;border:3px solid}
.pl .nm{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl.cur{outline:3px solid var(--gold)}
.pl.off{opacity:.45}
.pl .st{font-weight:800;white-space:nowrap}
.note{color:var(--mut);font-size:.9rem;text-align:center}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:8px}
.pill{background:var(--card);padding:6px 12px;border-radius:999px}
.board{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr);gap:3px;aspect-ratio:1;width:100%;
  background:#13062a;border-radius:16px;padding:6px}
.cell{position:relative;border-radius:8px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:1px;
  box-shadow:inset 0 -3px 0 #0005}
.cell.B{background:var(--blue)}.cell.R{background:var(--red)}.cell.E{background:var(--ev)}.cell.S{background:var(--start)}
.cell .ic{position:absolute;inset:0;display:grid;place-items:center;font-size:.9rem;opacity:.55;pointer-events:none}
.cell.crown{outline:3px solid var(--gold);animation:glow 1.2s infinite alternate}
.cell .cr{position:absolute;top:-10px;right:-6px;font-size:1.1rem;z-index:3;filter:drop-shadow(0 2px 2px #000)}
@keyframes glow{to{box-shadow:0 0 14px var(--gold)}}
.tok{width:46%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:clamp(.6rem,2.6vw,.95rem);background:#fff;border:2px solid;z-index:2;line-height:1}
.tok.me{box-shadow:0 0 0 2px #fff}
.tok.act{animation:hop .5s infinite alternate}
@keyframes hop{to{transform:translateY(-4px)}}
.center{grid-column:2/7;grid-row:2/7;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px;gap:6px}
.dice{width:64px;height:64px;border-radius:14px;background:#fff;color:#1e0b3a;font-size:2.4rem;font-weight:900;display:grid;place-items:center;box-shadow:0 5px 0 #aaa}
.dice.spin{animation:shake .15s infinite}
@keyframes shake{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.msg{font-weight:700;font-size:1rem;min-height:2.4em}
.legend{display:flex;justify-content:center;gap:10px;font-size:.75rem;color:var(--mut);margin-top:6px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.action{margin:10px 0}
.wait{text-align:center;color:var(--mut);font-weight:700;padding:14px}
.mg{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px}
.mgname{font-size:2rem;font-weight:900;color:var(--gold)}
.cd{font-size:4rem;font-weight:900}
.tapbtn{width:220px;height:220px;border-radius:50%;font-size:2.2rem;margin:0 auto}
.reflex{width:100%;height:60vh;border-radius:20px;display:grid;place-items:center;font-size:2.4rem;font-weight:900;touch-action:manipulation}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.opts button{margin:0;font-size:1.5rem;padding:18px}
.problem{font-size:3rem;font-weight:900}
.timer{font-weight:800;color:var(--mut)}
.bar{width:100%;height:10px;background:#0005;border-radius:99px;overflow:hidden}
.bar>div{height:100%;background:var(--gold);width:100%}
.flash-bad{animation:bad .4s}
@keyframes bad{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.balloon{border-radius:50% 50% 48% 48%;background:radial-gradient(circle at 35% 30%,#ffb3c1,#ff4d6d);transition:width .1s,height .1s;margin:0 auto}
.rank{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:#24104a;margin-top:6px;width:100%;text-align:left}
.rank .pos{font-size:1.4rem;width:34px;text-align:center}
.rank .prize{color:var(--gold);font-weight:900}
.chars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chars button{margin:0;padding:4px 2px 6px;background:#1c0b36;box-shadow:none;border:3px solid transparent;color:#fff;font-size:.8rem;border-radius:14px}
.chars button img{width:100%;aspect-ratio:1;border-radius:10px;display:block;margin-bottom:3px;background:#000}
.chars button.sel{border-color:var(--gold);background:#4b2a86}
.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.themes button{margin:0;padding:12px 6px;font-size:.95rem;line-height:1.3}
.themes button b{font-size:1.8rem;display:block}
body.b3d #app{max-width:none;padding:0}
.hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;z-index:5;
  padding:calc(env(safe-area-inset-top) + 8px) 10px calc(env(safe-area-inset-bottom) + 10px)}
.hud>*{pointer-events:auto}
.hud-top{display:flex;gap:6px;justify-content:space-between;align-items:center;flex-wrap:wrap;pointer-events:none}
.hud-top>*{pointer-events:auto}
.glass{background:rgba(30,11,58,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:16px;box-shadow:0 4px 16px #0005}
.hud .pill{background:rgba(30,11,58,.82);display:inline-flex;align-items:center;gap:6px;font-weight:800}
.hud .pill .av{width:26px;height:26px;border-width:2px}
.mini{display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin-top:8px;pointer-events:none}
.mini div{display:flex;align-items:center;gap:6px;padding:3px 8px 3px 3px;border-radius:999px;background:rgba(30,11,58,.72);font-weight:800;font-size:.8rem}
.mini div.cur{outline:2px solid var(--gold)}
.mini .av{width:26px;height:26px;border-width:2px}
.hud-bottom{padding:12px;margin-top:auto}
.hud-bottom .msg{text-align:center;min-height:1.3em;margin-bottom:4px}
.hud-bottom .wait{padding:6px}
.viewbtn{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 56px);width:48px;height:48px;padding:0;font-size:1.4rem;border-radius:50%;z-index:6;margin:0}
.tag{font-size:.75rem;background:#7c5cc4;padding:2px 6px;border-radius:999px;font-weight:700;white-space:nowrap}
.pl button.x{width:34px;height:34px;padding:0;margin:0;font-size:.9rem;background:#64748b;color:#fff;box-shadow:none}
#banner{position:fixed;left:0;right:0;top:0;z-index:50;background:#b91c1c;color:#fff;text-align:center;padding:10px;font-weight:700;display:none}
#banner button{width:auto;padding:6px 14px;margin:0 0 0 8px;font-size:.95rem}
.podium{font-size:3.5rem;text-align:center}
</style>
</head>
<body>
<div id="banner"></div>
<div id="app"></div>
<script type="importmap">{"imports":{"three":"./lib/three.module.min.js"}}</script>
<script src="lib/peerjs.min.js"></script>
<script src="boards.js"></script>
<script src="minigames.js"></script>
<script src="sfx.js"></script>
<script>
'use strict';
/* ================= Config ================= */
const PREFIX = 'fiestatablero-v1-';
const CROWN_COST = 20;
const MAX_PLAYERS = 8;
const COLORS = ['#ff4d6d','#4dabf7','#51cf66','#fcc419','#b197fc','#ff922b','#20c997','#f783ac'];
const CHARS = [
  {id:'rana', name:'Rana', emoji:'🐸'}, {id:'gato', name:'Gato', emoji:'🐱'}, {id:'panda', name:'Panda', emoji:'🐼'}, {id:'zorro', name:'Zorro', emoji:'🦊'},
  {id:'pinguino', name:'Pingüino', emoji:'🐧'}, {id:'cerdito', name:'Cerdito', emoji:'🐷'}, {id:'mono', name:'Mono', emoji:'🐵'}, {id:'tigre', name:'Tigre', emoji:'🐯'},
];
window.FIESTA_CHARS = CHARS;
const EMOJIS = CHARS.map(c => c.emoji);
const charOf = e => CHARS.find(c => c.emoji === e) || CHARS[0];
const avImg = p => `<img src="models/${charOf(p.emoji).id}.jpg" alt="${p.emoji}" onerror="this.outerHTML='${p.emoji}'">`;
// Mundos temáticos: cada uno con su propia distribución de casillas
const THEMES = {
  isla:   {name:'Isla Tropical',   icon:'🏝️', desc:'Atajo por el medio de la isla y un desvío por la playa'},
  dulces: {name:'Reino de Dulces', icon:'🍭', desc:'Camino en zigzag con muchas casillas rojas en el atajo'},
  lava:   {name:'Volcán de Lava',  icon:'🌋', desc:'Atajo cruzando la lava y un rodeo largo por las rocas'},
  nieve:  {name:'Pueblo Nevado',   icon:'❄️', desc:'Gran atajo por el centro y desvío al lago helado'},
};
// S=salida, B=azul(+3), R=roja(-3), E=evento
const graph = () => BOARDS.build((S && S.theme) || (H.state && H.state.theme) || 'isla');
const PRIZES = [10, 6, 4, 2, 1, 0, 0, 0];
// Catálogo de minijuegos 3D (minigames.js)
const MG = Object.fromEntries(MGCAT.map(m => [m.id, { ...m, td: true }]));
const MG_KEYS = Object.keys(MG);
// Objetos de la tienda
const ITEMS = {
  doble:   {name:'Dado Doble',   icon:'🎲', price:6,  desc:'Tiras 2 dados'},
  triple:  {name:'Dado Triple',  icon:'🎰', price:12, desc:'Tiras 3 dados'},
  tortuga: {name:'Dado Tortuga', icon:'🐢', price:3,  desc:'Sale 1, 2 o 3: para caer justo donde quieres'},
  cambio:  {name:'Intercambio',  icon:'🔀', price:10, desc:'Cambias de lugar con un rival al azar'},
  iman:    {name:'Imán',         icon:'🧲', price:8,  desc:'Le quitas 5 🪙 a un rival al azar'},
  brujula: {name:'Brújula',      icon:'🧭', price:15, desc:'Te deja a 4 casillas de la corona'},
};
const MAX_ITEMS = 3;
// Bots (modo vs IA): qué tan bien juegan cada minijuego según la dificultad
const BOT_LEVELS = { facil:{name:'Fácil', k:0}, normal:{name:'Normal', k:1}, dificil:{name:'Difícil', k:2} };
function botScore(type, lvl, seed){
  const k = (BOT_LEVELS[lvl] || BOT_LEVELS.normal).k, r = Math.random, between = ([a, b]) => a + r() * (b - a);
  switch (type) {
    case 'taps':   return Math.round(between([[18, 30], [28, 40], [38, 52]][k]));
    case 'reflex': return r() < [0.12, 0.06, 0.03][k] ? 9999 : Math.round(between([[360, 560], [270, 400], [205, 300]][k]));
    case 'math':   return Math.round(between([[2, 5], [5, 8], [8, 12]][k]));
    case 'color':  return Math.round(between([[3, 6], [6, 9], [9, 13]][k]));
    case 'clock':  return r() < 0.03 ? 9999 : Math.round(between([[150, 700], [50, 320], [8, 140]][k]));
    case 'balloon': {
      const limit = 10 + Math.floor(mulberry32(seed)() * 25); // mismo globo que ven los humanos
      const want = Math.round(between([[6, 18], [10, 24], [14, 30]][k]));
      if (k === 2 && want >= limit && r() < 0.6) return Math.max(1, limit - 1 - Math.floor(r() * 3)); // la IA difícil "intuye" el límite
      return want >= limit ? 0 : want;
    }
  }
  return 0;
}
const WEB_URL = 'https://kinoschaffer.github.io/fiesta/';
const APP = window.AndroidBridge || null; // existe cuando corre dentro de la app de Android

/* ================= Utils ================= */
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pick = a => a[Math.floor(Math.random() * a.length)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid = () => Math.random().toString(36).slice(2, 10);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function st(kind){ const s = kind==='l'?'localStorage':'sessionStorage';
  return {get:k=>{try{return window[s].getItem(k)}catch(e){return null}}, set:(k,v)=>{try{window[s].setItem(k,v)}catch(e){}}}; }
const ss = st('s'), ls = st('l');
const params = new URLSearchParams(location.search);
const LOCAL = params.has('local'); // modo prueba: varias pestañas del mismo navegador

let myId = ss.get('fid') || rid(); ss.set('fid', myId);
const prefs = { sound: ls.get('fsound') !== '0', low: ls.get('flow') === '1' };
const me = { name: ls.get('fname') || '', emoji: EMOJIS.includes(ls.get('femoji')) ? ls.get('femoji') : pick(EMOJIS) };
let role = null;     // 'host' | 'client'
let S = null;        // último estado del juego
const ui = { screen:'home', error:'', code:(params.get('sala')||'').toUpperCase(), viewKey:null, mgCleanup:null };
const net = {};

/* ================= Red ================= */
const H = { state:null, conns:new Map(), turnToken:0, crownResolve:null, mgTimer:null };

function makeCode(){ const A='ABCDEFGHJKLMNPQRSTUVWXYZ'; let c=''; for(let i=0;i<4;i++) c+=A[Math.floor(Math.random()*A.length)]; return c; }

function startHost(solo){
  role = 'host';
  const code = makeCode();
  H.state = newState(code);
  addPlayer(myId, me.name, me.emoji);
  if (solo) { // vs IA: no hace falta internet
    H.state.solo = true;
    for (let i = 0; i < 3; i++) addBot(ui.botLvl || 'normal');
    broadcast(); return;
  }
  ui.screen = 'connecting'; render();
  if (LOCAL) { localHost(code); broadcast(); return; }
  const peer = new Peer(PREFIX + code, {debug:0});
  H.peer = peer;
  peer.on('open', () => broadcast());
  peer.on('connection', conn => {
    conn.on('data', d => hostRecv(conn, d));
    conn.on('close', () => hostConnClosed(conn));
    conn.on('error', () => hostConnClosed(conn));
  });
  peer.on('disconnected', () => { setTimeout(() => { try { if (!peer.destroyed) peer.reconnect(); } catch(e){} }, 1000); });
  peer.on('error', err => {
    if (err.type === 'unavailable-id') { peer.destroy(); startHost(); }
    else if (!S) fail('No se pudo crear la sala (' + err.type + '). Revisa tu internet.');
  });
}

function localHost(code){
  const ch = new BroadcastChannel('fiesta-' + code), conns = {};
  ch.onmessage = e => { const m = e.data; if (m.to !== 'host') return;
    let c = conns[m.from]; if (!c) c = conns[m.from] = { send: d => ch.postMessage({to:m.from, data:d}) };
    if (m.kind === 'close') { hostConnClosed(c); delete conns[m.from]; return; }
    hostRecv(c, m.data); };
}

function hostRecv(conn, msg){
  if (!msg || typeof msg !== 'object') return;
  if (msg.t === 'join') {
    if (typeof msg.id !== 'string') return;
    const ok = joinPlayer(msg);
    if (!ok) { try { conn.send({t:'reject', reason: H.state.phase === 'lobby' ? `La sala está llena (máx. ${MAX_PLAYERS}).` : 'La partida ya empezó.'}); } catch(e){} return; }
    conn._pid = msg.id; H.conns.set(msg.id, conn); broadcast(); return;
  }
  if (conn._pid) hostAction(conn._pid, msg);
}

function hostConnClosed(conn){
  const pid = conn._pid;
  if (pid && H.conns.get(pid) === conn) {
    H.conns.delete(pid);
    const p = findP(pid); if (p) { p.connected = false; broadcast(); }
    if (H.state.phase === 'mg-play') checkMgDone();
  }
}

function broadcast(){
  const s = H.state; s.seq++;
  for (const c of H.conns.values()) { try { c.send({t:'state', s}); } catch(e){} }
  onState(s);
}

function startClient(code){
  role = 'client'; ui.code = code; ss.set('fcode', code);
  ui.screen = 'connecting'; ui.error = ''; render();
  clearTimeout(net.to);
  net.to = setTimeout(() => { if (!S) fail('No se pudo conectar a la sala ' + code + '.'); }, 15000);
  if (LOCAL) {
    const ch = new BroadcastChannel('fiesta-' + code);
    ch.onmessage = e => { if (e.data.to === myId) clientRecv(e.data.data); };
    net.conn = { send: d => ch.postMessage({to:'host', from:myId, data:d}) };
    addEventListener('beforeunload', () => ch.postMessage({to:'host', from:myId, kind:'close'}));
    sendJoin(); return;
  }
  try { net.peer && net.peer.destroy(); } catch(e){}
  const peer = new Peer({debug:0}); net.peer = peer;
  peer.on('open', () => {
    const conn = peer.connect(PREFIX + code, {reliable:true}); net.conn = conn;
    conn.on('open', sendJoin);
    conn.on('data', clientRecv);
    conn.on('close', lost);
    conn.on('error', lost);
  });
  peer.on('error', err => {
    if (err.type === 'peer-unavailable') fail('No existe la sala ' + code + '. Revisa el código.');
    else if (!S) fail('Error de conexión (' + err.type + ').');
    else lost();
  });
}
function sendJoin(){ net.conn.send({t:'join', id:myId, name:me.name, emoji:me.emoji}); }
function clientRecv(d){
  if (!d) return;
  if (d.t === 'state') { clearTimeout(net.to); setBanner(''); onState(d.s); }
  else if (d.t === 'mgp') { if (window.MG3D) MG3D.net(d); }
  else if (d.t === 'reject') { fail(d.reason); }
}
function lost(){ if (role !== 'client') return;
  setBanner('Conexión perdida con el anfitrión <button data-act="reconnect">Reconectar</button>'); }
function fail(text){ ss.set('fcode', ''); S = null; role = null; ui.screen = 'home'; ui.error = text; ui.viewKey = null; render(); }
function send(msg){ if (role === 'host') hostAction(myId, msg); else if (net.conn) { try { net.conn.send(msg); } catch(e){ lost(); } } }
function setBanner(html){ const b = $('#banner'); b.innerHTML = html; b.style.display = html ? 'block' : 'none'; }

/* ================= Lógica (sólo anfitrión) ================= */
function newState(code){
  return {code, phase:'lobby', round:0, maxRounds:8, players:[], turn:0, crown:randSpot(-1, []), dice:null, rollId:0,
    msg:'', hostId:myId, mg:null, mgHist:[], seq:0, bonus:null, theme:'isla', fork:null, duelPick:null};
}
const findP = id => H.state.players.find(p => p.id === id);
const T = ms => H.state && H.state.fast ? Math.round(ms * 0.6) : ms; // turnos rápidos
const cur = () => H.state.players[H.state.turn];
function randSpot(exclude, players){
  const nodes = graph().nodes, occ = new Set((players||[]).map(p => p.pos));
  let opts = nodes.filter(n => n.id !== 0 && n.id !== exclude && !occ.has(n.id) && n.type !== 'D').map(n => n.id);
  if (!opts.length) opts = nodes.filter(n => n.id !== 0 && n.id !== exclude).map(n => n.id);
  return pick(opts);
}
function addPlayer(id, name, emoji){
  const used = H.state.players.map(p => p.color);
  H.state.players.push({id, name:String(name||'Jugador').slice(0,12), emoji:EMOJIS.includes(emoji)?emoji:pick(EMOJIS),
    color:COLORS.find(c => !used.includes(c)), pos:0, coins:10, crowns:0, wins:0, connected:true});
}
function addBot(lvl){

function hostAction(pid, msg){
  const s = H.state, p = findP(pid); if (!p) return;
  const isHost = pid === s.hostId;
  switch (msg.t) {
    case 'fast': if (isHost && s.phase === 'lobby') { s.fast = !!msg.v; broadcast(); } break;
    case 'rounds': if (isHost && s.phase === 'lobby') { s.maxRounds = Math.max(3, Math.min(20, msg.n|0)); broadcast(); } break;
    case 'theme': if (isHost && s.phase === 'lobby' && THEMES[msg.v]) { s.theme = msg.v; broadcast(); } break;
    case 'fork': if (s.phase === 'fork' && cur().id === pid && s.fork && s.fork.opts.includes(msg.to) && H.forkResolve) H.forkResolve(msg.to); break;
    case 'duel': if (s.phase === 'duel-pick' && cur().id === pid && H.duelResolve && findP(msg.id) && msg.id !== pid) H.duelResolve(msg.id); break;
    case 'addbot': if (isHost && s.phase === 'lobby') { addBot(msg.lvl); broadcast(); } break;
    case 'delbot': if (isHost && s.phase === 'lobby') { s.players = s.players.filter(x => !(x.bot && x.id === msg.id)); broadcast(); } break;
    case 'start': if (isHost && s.phase === 'lobby' && s.players.length >= 2) startGame(); break;
    case 'roll': if (s.phase === 'turn' && cur().id === pid) doRoll(); break;
    case 'use': if (s.phase === 'turn' && cur().id === pid && !s.itemUsed && p.items.includes(msg.item)) useItem(p, msg.item); break;
    case 'buy': if (s.phase === 'shop' && cur().id === pid && H.shopResolve) H.shopResolve(msg.item || null); break;
    case 'crown': if (s.phase === 'crown' && cur().id === pid && H.crownResolve) H.crownResolve(!!msg.buy); break;
    case 'score':
      if (s.phase === 'mg-play' && s.mg && msg.key === s.mg.key && !(pid in s.mg.scores) && Number.isFinite(+msg.v)) {
        s.mg.scores[pid] = s.mg.type === 'monedas' && H.mgNet ? (H.mgNet.counts[pid] || 0) : +msg.v; broadcast(); checkMgDone(); }
      break;
    case 'mgpos':
      if (s.phase === 'mg-play' && s.mg && msg.key === s.mg.key && H.mgNet && Array.isArray(msg.a)) H.mgNet.pos[pid] = msg.a.slice(0, 7).map(Number);
      break;
    case 'mggrab': case 'mgact':
      if (s.phase === 'mg-play' && s.mg && msg.key === s.mg.key && H.mgCtx && s.mg.players.includes(pid))
        MGL.host.action(H.mgCtx, pid, msg, performance.now() - H.mgT0, H.mgNet);
      break;
    case 'again': if (isHost && s.phase === 'end') { s.phase = 'lobby'; s.bonus = null; s.focus = null; s.mg = null; broadcast(); } break;
  }
}

function startGame(){

    p.stats = { earned: 0, red: 0, steps: 0, bought: 0, duels: 0, events: 0, mg: 0 }; });
  s.helped = false;
  s.round = 1; s.turn = 0; s.crown = randSpot(-1, s.players); s.mgHist = [];

}

function beginTurn(){

  s.phase = 'turn'; s.dice = null; s.diceMode = null; s.itemUsed = null; s.msg = `Turno de ${p.emoji} ${p.name}`;
  if (s.turn === 0 && s.round === s.maxRounds) s.msg = '🔥 ¡ÚLTIMA RONDA! ' + s.msg;
  broadcast();
  const tok = ++H.turnToken;
  if (p.bot) setTimeout(() => { if (H.turnToken === tok && s.phase === 'turn') botUseItem(p); }, 700);
  setTimeout(() => { if (H.turnToken === tok && s.phase === 'turn') doRoll(); }, p.bot ? 1500 + Math.random() * 900 : p.connected ? 30000 : 2500);
}
function useItem(p, id){
  const s = H.state, g = graph(), it = ITEMS[id]; p.items.splice(p.items.indexOf(id), 1); s.itemUsed = id; p.stats.bought++;
  const rivals = s.players.filter(x => x !== p);
  let extra = '';
  if (id === 'doble' || id === 'triple' || id === 'tortuga') s.diceMode = id;
  else if (id === 'cambio' && rivals.length) { const r = pick(rivals); [p.pos, r.pos] = [r.pos, p.pos]; extra = ` y cambia de lugar con ${r.name}`; }
  else if (id === 'iman' && rivals.length) { const r = rivals.slice().sort((a, b) => b.coins - a.coins)[0], l = Math.min(5, r.coins); r.coins -= l; p.coins += l; p.stats.earned += l; extra = `: le quita ${l} 🪙 a ${r.name}`; }

  s.msg = `🎒 ${p.name} usa ${it.icon} ${it.name}${extra}`; broadcast();
}
function botUseItem(p){
  const s = H.state, g = graph(); if (!p.items.length || s.itemUsed) return;
  const d = BOARDS.dist(g, p.pos, s.crown, p.dir), rich = p.coins >= CROWN_COST;
  const want = p.items.find(i => (i === 'brujula' && rich) || (i === 'iman') || ((i === 'doble' || i === 'triple') && d > 6) || (i === 'tortuga' && d >= 1 && d <= 3 && rich) || (i === 'cambio' && s.players.some(x => x !== p && BOARDS.dist(g, x.pos, s.crown, 1) < d - 4)));

}
async function shopTile(p){
  const s = H.state, offer = Object.keys(ITEMS).sort(() => Math.random() - 0.5).slice(0, 4);

  s.phase = 'shop'; s.shop = {offer}; s.msg = `🛒 ¡Tienda! ${p.name} puede comprar un objeto`; broadcast();
  const buy = await new Promise(res => { H.shopResolve = res;
    if (p.bot) { const afford = offer.filter(i => ITEMS[i].price <= p.coins - (p.coins >= CROWN_COST + 6 ? 0 : 4)).sort((a, b) => ITEMS[b].price - ITEMS[a].price);
      setTimeout(() => res(afford.length && Math.random() < 0.8 ? afford[0] : null), 1400); }
    else setTimeout(() => res(null), p.connected ? 20000 : 1500); });
  H.shopResolve = null; s.shop = null; s.phase = 'event';
  if (buy && offer.includes(buy) && ITEMS[buy].price <= p.coins) { p.coins -= ITEMS[buy].price; p.items.push(buy); s.msg = `🛒 ${p.name} compra ${ITEMS[buy].icon} ${ITEMS[buy].name}`; }

async function doRoll(){
  const s = H.state, p = cur(); H.turnToken++;
  const d6 = () => 1 + Math.floor(Math.random() * 6), mode = s.diceMode;
  const parts = mode === 'doble' ? [d6(), d6()] : mode === 'triple' ? [d6(), d6(), d6()] : mode === 'tortuga' ? [1 + Math.floor(Math.random() * 3)] : [d6()];
  s.phase = 'rolling'; s.dice = parts.reduce((a, b) => a + b, 0); s.rollId++;
  s.msg = `${p.name} tira ${parts.length > 1 ? parts.length + ' dados' : 'el dado'}…`; broadcast();
  await sleep(T(1100));
  s.phase = 'moving'; s.msg = parts.length > 1 ? `${p.name} saca ${parts.join(' + ')} = ${s.dice}` : `${p.name} saca un ${s.dice}`;
  p.stats.steps += s.dice;
  const g = graph();
  for (let steps = s.dice; steps > 0; steps--) {
    await sleep(T(340));
    const node = g.nodes[p.pos], opts = (p.dir < 0 ? node.prev : node.next);
    let to = opts[0];
    if (opts.length > 1) to = await chooseFork(p, opts, steps);
    p.pos = to; s.steps = steps - 1; broadcast();
    if (p.pos === s.crown) await crownStop(p);
  }
  await sleep(T(450));
  await landOn(p);
  s.turn++;
  if (s.turn >= s.players.length) { s.turn = 0; await roundMinigame(); nextRound(); } else beginTurn();
}
async function nextRound(){ const s = H.state; if (s.round >= s.maxRounds) return endGame(); s.round++; s.turn = 0;
  if (s.round === Math.max(2, s.maxRounds - 2) && !s.helped && s.players.length > 1) { // ayuda al que va último
    s.helped = true; const last = s.players.slice().sort((a, b) => a.crowns - b.crowns || a.coins - b.coins)[0];
    s.phase = 'event'; s.msg = '🔥 ¡Quedan 3 rondas! Desde ahora las casillas azules y rojas valen el doble.'; broadcast(); await sleep(T(3000));
    if (Math.random() < 0.5 || last.items.length >= MAX_ITEMS) { last.coins += 15; last.stats.earned += 15; s.msg = `🎁 Ayuda al último: ${last.name} recibe 15 🪙`; }
    else { last.items.push('triple'); s.msg = `🎁 Ayuda al último: ${last.name} recibe un 🎰 Dado Triple`; }
    broadcast(); await sleep(T(3000)); }
  beginTurn(); }

async function chooseFork(p, opts, stepsLeft){
  const s = H.state, g = graph();
  s.phase = 'fork'; s.fork = {opts, steps: stepsLeft}; s.msg = `${p.name} elige por dónde seguir`; broadcast();
  const to = await new Promise(res => { H.forkResolve = res;
    if (p.bot) { const k = BOT_LEVELS[p.lvl].k;
      const best = opts.slice().sort((a, b) => BOARDS.dist(g, a, s.crown, p.dir) - BOARDS.dist(g, b, s.crown, p.dir))[0];
      setTimeout(() => res(Math.random() < [0.4, 0.7, 0.9][k] && p.coins >= CROWN_COST - 6 ? best : pick(opts)), 900); }
    else setTimeout(() => res(pick(opts)), p.connected ? 15000 : 1500); });
  H.forkResolve = null; s.fork = null; s.phase = 'moving';
  const n = g.nodes[to]; s.msg = n.branch === 'atajo' ? `⚡ ${p.name} toma el atajo` : n.branch === 'desvio' ? `🌴 ${p.name} se va por el desvío` : `${p.name} sigue por el camino principal`;

}

async function crownStop(p){

  const buy = await new Promise(res => { H.crownResolve = res;
    if (p.bot) setTimeout(() => res(p.lvl !== 'facil' || Math.random() < 0.6), 1300);
    else setTimeout(() => res(true), p.connected ? 20000 : 1500); });
  H.crownResolve = null;
  if (buy) { p.coins -= CROWN_COST; p.crowns++; s.msg = `👑 ¡${p.name} consigue una corona! La corona se mueve…`; s.crown = randSpot(s.crown, s.players); }
  else s.msg = `${p.name} deja pasar la corona`;

async function landOn(p){
  const s = H.state, t = graph().nodes[p.pos].type;
  s.phase = 'event'; p.tile = t === 'S' ? 'B' : t;
  const late = s.round > s.maxRounds - 3; // en las últimas 3 rondas, las casillas valen el doble
  if (t === 'B' || t === 'S') { const g2 = late ? 6 : 3; p.coins += g2; p.stats.earned += g2; s.msg = `🔵 ${p.name} gana ${g2} 🪙`; }
  else if (t === 'R') { const l = Math.min(late ? 6 : 3, p.coins); p.coins -= l; p.stats.red++; s.msg = `🔴 ${p.name} pierde ${l} 🪙`; }
  else if (t === 'T') { broadcast(); await shopTile(p); return; }
  else if (t === 'V') { p.dir = -(p.dir || 1); s.msg = p.dir < 0 ? `🔄 ¡Cambio de sentido! ${p.name} ahora avanza hacia atrás` : `🔄 ¡Cambio de sentido! ${p.name} vuelve a avanzar hacia adelante`; }
  else if (t === 'D') { broadcast(); await duelTile(p); return; }
  else { p.stats.events++; s.msg = randomEvent(p); }
  broadcast(); await sleep(T(2300));
}
async function duelTile(p){
  const s = H.state, rivals = s.players.filter(x => x !== p);

  s.phase = 'duel-pick'; s.duelPick = {pid: p.id}; s.msg = `⚔️ ¡Casilla de duelo! ${p.name} elige a quién retar`; broadcast();
  const oppId = await new Promise(res => { H.duelResolve = res;
    if (p.bot) setTimeout(() => res((rivals.slice().sort((a, b) => b.coins - a.coins)[Math.random() < 0.6 ? 0 : Math.floor(Math.random() * rivals.length)]).id), 1300);
    else setTimeout(() => res(pick(rivals).id), p.connected ? 20000 : 1500); });

  const opp = findP(oppId);
  s.phase = 'event'; s.msg = `⚔️ ${p.name} reta a ${opp.name}. ¡El ganador se lleva hasta 10 🪙!`; broadcast(); await sleep(T(2000));
  await playMinigame({ players: [p.id, opp.id], format: 'duel', teams: {A: [p.id], B: [opp.id]}, wager: 10 });

function randomEvent(p){
  const s = H.state, rivals = s.players.filter(x => x !== p);
  const evs = [
    () => { p.coins += 8; return `🎁 ¡Cofre! ${p.name} encuentra 8 🪙`; },
    () => { const l = Math.min(5, p.coins); p.coins -= l; return `🕳️ Bolsillo roto: ${p.name} pierde ${l} 🪙`; },
    () => { p.pos = randSpot(p.pos, []); return `🌀 ¡Remolino! ${p.name} sale volando a otra casilla`; },
    () => { s.crown = randSpot(s.crown, s.players); return `💨 Una ráfaga de viento mueve la corona 👑`; },
  ];
  if (rivals.length) evs.push(
    () => { const r = pick(rivals), l = Math.min(5, r.coins); r.coins -= l; p.coins += l; return `🦝 ${p.name} le roba ${l} 🪙 a ${r.name}`; },
    () => { const r = pick(rivals); [p.pos, r.pos] = [r.pos, p.pos]; return `🔄 ${p.name} cambia de lugar con ${r.name}`; },
    () => { let t = 0; rivals.forEach(r => { const g = Math.min(2, r.coins); r.coins -= g; t += g; }); p.coins += t; return `🎉 ¡Fiesta! Cada rival le regala 2 🪙 a ${p.name}`; },
    () => { rivals.forEach(r => { const g = Math.min(2, p.coins); p.coins -= g; r.coins += g; }); return `🤲 ${p.name} se siente generoso y regala 2 🪙 a cada rival`; },
  );

// Equipos según el color de la última casilla: azul vs rojo (las demás se sortean)
function roundMinigame(){
  const s = H.state, A = [], B = [];
  s.players.forEach(p => { const c = p.tile === 'B' || p.tile === 'R' ? p.tile : (Math.random() < 0.5 ? 'B' : 'R'); (c === 'B' ? A : B).push(p.id); p.team = c; });
  // con muchos jugadores, no dejar equipos muy desparejos (p. ej. 1 contra 7 → 3 contra 5)
  if (A.length && B.length) while (Math.abs(A.length - B.length) > 2) { const [big, small] = A.length > B.length ? [A, B] : [B, A]; small.push(big.splice(Math.floor(Math.random() * big.length), 1)[0]); }
  s.players.forEach(p => p.team = A.includes(p.id) ? 'B' : 'R');
  let format = 'ffa';
  if (s.players.length >= 3 && A.length && B.length) format = (A.length === 1 || B.length === 1) ? '1vN' : 'team';
  const teams = format === 'ffa' ? null : {A, B};
  return playMinigame({ players: s.players.map(p => p.id), format, teams });
}
function playMinigame(opts){ return new Promise(res => { H.mgResolve = res; startMinigame(opts); }); }
function startMinigame(opts){
  const s = H.state;
  let pool = MG_KEYS.filter(k => (MG[k].formats || ['ffa', 'team', '1vN', 'duel']).includes(opts.format));
  const fresh = pool.filter(k => !s.mgHist.includes(k)); if (fresh.length) pool = fresh;
  let type = pick(pool);
  if (MG_KEYS.includes(params.get('mg'))) type = params.get('mg'); // para pruebas
  s.mgHist.push(type); if (s.mgHist.length > Math.min(30, MG_KEYS.length - 3)) s.mgHist.shift();
  s.mg = {type, key: s.round + '-' + rid(), seed: (Math.random() * 1e9) | 0, scores:{}, ranking:null,
    players: opts.players, format: opts.format, teams: opts.teams || null, wager: opts.wager || 0, result: null};
  s.phase = 'mg-intro'; s.msg = ''; broadcast();
  setTimeout(() => {
    s.phase = 'mg-play'; broadcast(); H.mgTimer = setTimeout(finishMinigame, MG[type].dur + 3500);
    const key = s.mg.key, dur = MG[type].dur;
    if (MG[type].td) {
      H.mgNet = {pos:{}, taken:{}, counts:{}, ev:[], team:null}; H.mgT0 = performance.now(); H.mgLast = 0;
      const ps = s.mg.players.map(findP);
      H.mgCtx = MGL.host.init(type, s.mg.seed, ps, dur, s.mg.teams, s.mg.format);
      clearInterval(H.mgLoop); H.mgLoop = setInterval(hostMgTick, 100);
      return;
    }
    s.mg.players.map(findP).filter(p => p.bot).forEach(b => setTimeout(() => {
      if (s.phase === 'mg-play' && s.mg.key === key && !(b.id in s.mg.scores)) { s.mg.scores[b.id] = botScore(type, b.lvl, s.mg.seed); broadcast(); checkMgDone(); }
    }, dur * (0.55 + Math.random() * 0.4)));
  }, 6000);
}
function hostMgTick(){
  const s = H.state;
  if (s.phase !== 'mg-play' || !s.mg || !MG[s.mg.type].td) { clearInterval(H.mgLoop); return; }
  const now = performance.now() - H.mgT0, total = Math.min(2, (now - H.mgLast) / 1000); H.mgLast = now;
  let changed = false;
  if (H.mgCtx) {
    // si el celular se atrasó, simular en pasos pequeños para ponerse al día
    const n = Math.max(1, Math.ceil(total / 0.1));
    for (let i = 1; i <= n; i++) {
      const got = MGL.host.step(H.mgCtx, total / n, now - (n - i) * total / n * 1000, H.mgNet);
      for (const [id, v] of Object.entries(got)) if (!(id in s.mg.scores)) { s.mg.scores[id] = v; changed = true; }
    }
    Object.assign(H.mgNet.pos, MGL.host.pos(H.mgCtx));
    if (now >= MG[s.mg.type].dur) for (const id of Object.keys(H.mgCtx.bots)) if (!(id in s.mg.scores)) { s.mg.scores[id] = MGL.host.final(H.mgCtx, id, H.mgNet); changed = true; }
  }
  const msg = {t:'mgp', key:s.mg.key, p:H.mgNet.pos, taken:H.mgNet.taken, counts:H.mgNet.counts, ev:H.mgNet.ev, x:H.mgNet.x, over:!!H.mgNet.over};
  for (const c of H.conns.values()) { try { c.send(msg); } catch(e){} }
  if (window.MG3D) MG3D.net(msg);
  if (changed || H.mgNet.over) { if (changed) broadcast(); checkMgDone(); }
}
function checkMgDone(){
  const s = H.state; if (s.phase !== 'mg-play') return;
  if (s.mg.players.map(findP).filter(p => p.connected).every(p => p.id in s.mg.scores) || (H.mgNet && H.mgNet.over)) { clearTimeout(H.mgTimer); finishMinigame(); }
}
function finishMinigame(){
  const s = H.state; if (s.phase !== 'mg-play') return;
  clearInterval(H.mgLoop);
  if (MG[s.mg.type].td && H.mgCtx) for (const id of Object.keys(H.mgCtx.bots)) if (!(id in s.mg.scores)) s.mg.scores[id] = MGL.host.final(H.mgCtx, id, H.mgNet);
  if (H.mgCtx) MGL.host.override(H.mgCtx, s.mg.scores, H.mgNet);
  const m = s.mg, lower = MG[m.type].lower;
  const arr = m.players.map(id => ({id, v: id in m.scores ? m.scores[id] : null}));
  arr.sort((a, b) => a.v === null ? 1 : b.v === null ? -1 : lower ? a.v - b.v : b.v - a.v);
  arr.forEach((e, i) => { e.rank = (i > 0 && e.v === arr[i-1].v) ? arr[i-1].rank : i; e.prize = 0; });
  const P = id => findP(id), win = ids => ids.forEach(id => P(id).wins++);
  if (m.format === 'ffa') {
    arr.forEach(e => { e.prize = e.v === null ? 0 : PRIZES[e.rank]; P(e.id).coins += e.prize; P(e.id).stats.earned += e.prize; if (e.rank === 0 && e.v !== null) P(e.id).wins++; });
  } else {

      else { W.forEach(id => { P(id).coins += 10; P(id).stats.earned += 10; }); arr.forEach(e => e.prize = W.includes(e.id) ? 10 : 0); }
      win(W);

async function endGame(){
  const s = H.state, pool = BONUSES.slice().sort(() => Math.random() - 0.5), chosen = [];
  for (const b of pool) { const best = Math.max(...s.players.map(b.val)); if (best <= 0) continue; chosen.push({ title:b.title, icon:b.icon, unit:b.unit, value:best, ids:s.players.filter(p => b.val(p) === best).map(p => p.id) }); if (chosen.length === 3) break; }
  s.bonus = chosen; s.phase = 'bonus'; s.bonusIdx = -1; s.msg = '🎉 ¡Premios sorpresa!'; broadcast(); await sleep(2500);

function sounds(prev, s){
  if (!window.SFX) return; const X = n => SFX.play(n);
  const ph = s.phase, was = prev ? prev.phase : null;
  const board = ['turn', 'rolling', 'moving', 'crown', 'event', 'fork', 'duel-pick'].includes(ph);
  SFX.music(ph === 'lobby' ? 'lobby' : board ? (s.theme || 'isla') : (ph === 'mg-intro' || ph === 'mg-play') ? 'mg' : null);
  const c = s.players[s.turn];
  if (ph === 'turn' && c && c.id === myId && (was !== 'turn' || prev.turn !== s.turn)) X('turn');
  if (ph === 'rolling' && (!prev || prev.rollId !== s.rollId) && !(c && c.id === myId)) X('dice');
  if (prev && c && ph === 'moving' && prev.pos[c.id] !== c.pos) X('step');
  if (ph === 'fork' && was !== 'fork') X('fork');
  if (ph === 'duel-pick' && was !== 'duel-pick') X('duel');
  if (ph === 'event' && prev && prev.msg !== s.msg) { const m = s.msg || '';
    X(m.startsWith('🔵') ? 'coin' : m.startsWith('🔴') ? 'lose' : m.startsWith('❓') ? 'event' : m.startsWith('🔄') ? 'whoosh' : m.startsWith('⚔') ? 'duel' : m.startsWith('🛒') ? 'shop' : m.startsWith('🎒') ? 'item' : 'event'); }
  if (prev && s.players.some(p => p.crowns > (prev.crowns[p.id] || 0)) && ph !== 'end') X('crown');
  if (ph === 'mg-play' && was !== 'mg-play') X('go');
  if (ph === 'mg-results' && was !== 'mg-results' && s.mg && s.mg.ranking) { const e = s.mg.ranking.find(x => x.id === myId); if (e) X(e.prize > 0 ? 'win' : 'lose'); }
  if (ph === 'end' && was !== 'end') X('fanfare');
}
function onState(s){
  const prev = S && S.phase; const snap = S ? { phase: S.phase, turn: S.turn, rollId: S.rollId, msg: S.msg, pos: Object.fromEntries(S.players.map(p => [p.id, p.pos])), crowns: Object.fromEntries(S.players.map(p => [p.id, p.crowns])) } : ui.snap;
  try { sounds(snap, s); } catch (e) {}

    <div style="margin:8px 0">${d.desc}</div>

}
function viewIntro(){
  const d = MG[S.mg.type];
  return `<div class="mg"><div class="note">¡MINIJUEGO!</div><div style="font-size:4rem">${d.icon}</div>
    <div class="mgname">${d.name}</div><div class="card">${d.desc}</div>
    <div class="note">Premios: 🥇 +10 · 🥈 +6 · 🥉 +4 · 4º +2 · 5º +1</div><div class="cd" id="cd">5</div></div>`;
}
function runCountdown(){
  const end = Date.now() + 5600;
  const t = setInterval(() => { const el = $('#cd'); if (!el) return clearInterval(t);
    const r = Math.min(5, Math.ceil((end - Date.now()) / 1000)); if (el.textContent !== String(r > 0 ? r : '¡YA!') && r > 0 && window.SFX) SFX.play('beep'); el.textContent = r > 0 ? r : '¡YA!'; }, 100);
  ui.mgCleanup = () => clearInterval(t);
}
function fmtScore(type, v){
  if (MGL.BYID[type]) return MGL.fmtScore(type, v);
  if (v === null || v === undefined) return 'sin resultado';
  switch (type) {
    case 'piso': case 'barra': case 'bolas': return v >= MG[type].dur ? '💪 ¡aguantó hasta el final!' : 'aguantó ' + (v / 1000).toFixed(1) + ' s';
    case 'monedas': return v + ' monedas';
    case 'carrera': return v < 100000 ? '🏁 ' + (v / 1000).toFixed(2) + ' s' : 'no llegó (faltaron ' + Math.round((v - 100000) / 1000) + ' m)';
    case 'taps': return v + ' toques';
    case 'reflex': return v >= 9999 ? '❌ falló' : v + ' ms';
    case 'clock': return v >= 9999 ? '❌ no lo detuvo' : '±' + (v / 1000).toFixed(2) + ' s';
    case 'balloon': return v === 0 ? '💥 explotó' : v + ' bombeos';
    default: return v + ' aciertos';
  }
}
function viewMgResults(){
  const m = S.mg, medals = ['🥇', '🥈', '🥉', '4º', '5º', '6º', '7º', '8º'];
  let head = '';
  if (m.teams && m.result) {
    const w = m.result.winner, names = ids => ids.map(id => esc((S.players.find(p => p.id === id) || {}).name || '')).join(' y ');
    head = w === 'tie' ? '<div class="card">🤝 ¡Empate! Nadie gana monedas.</div>'
      : m.format === 'duel' ? `<div class="card">⚔️ <b>${names(m.teams[w])}</b> gana el duelo y se lleva ${m.result.take} 🪙</div>`
      : `<div class="card" style="border:3px solid ${w === 'A' ? '#4dabf7' : '#ff6b6b'}">${w === 'A' ? '🔵' : '🔴'} ¡Gana <b>${names(m.teams[w])}</b>!</div>`;
  }
  return `<div class="mg"><div class="mgname">${MG[m.type].icon} Resultados</div>${head}
    ${m.ranking.map(e => { const p = S.players.find(x => x.id === e.id);
      return `<div class="rank"><div class="pos">${medals[e.rank]}</div><div class="av" style="width:44px;height:44px;border:3px solid ${p.color};border-radius:50%">${avImg(p)}</div>
      <div style="flex:1"><b>${esc(p.name)}</b><div class="note" style="text-align:left">${fmtScore(m.type, e.v)}</div></div>
      <div class="prize">${e.prize >= 0 ? '+' : ''}${e.prize} 🪙</div></div>`; }).join('')}
    <div class="note">${m.format === 'duel' ? 'Volviendo al tablero…' : S.round >= S.maxRounds ? 'Calculando ganador…' : 'Siguiente ronda en un momento…'}</div></div>`;
}
function bonusCard(b, big){
  const names = b.ids.map(id => esc((S.players.find(p => p.id === id) || {}).name || '')).join(' y ');
  return big ? `<div style="font-size:3rem">${b.icon}</div><div class="mgname" style="font-size:1.6rem">${b.title}</div><div style="margin:6px 0"><b>${names}</b> · ${b.value} ${b.unit}</div><div style="font-size:1.4rem;font-weight:900;color:var(--gold)">+1 👑</div>`
    : `<div class="note" style="text-align:left">${b.icon} ${b.title}: <b>${names}</b> +1 👑</div>`;
}
function viewBonus(){
  const i = S.bonusIdx, list = S.bonus || [];
  const body = i < 0 ? `<div style="font-size:3rem">🎁</div><div class="mgname">¡Premios sorpresa!</div><div>Se reparten ${list.length} coronas extra…</div>` : bonusCard(list[i], true);
  return `<div class="hud"><div class="hud-top"><span class="pill">🎉 Fin del juego</span></div>
    <div class="hud-bottom glass" style="text-align:center">${body}${list.slice(0, Math.max(0, i)).map(b => bonusCard(b)).join('')}</div></div>`;
}
function viewEnd(){
  const ranking = standings(), w = ranking[0];
  if (!has3D()) return `<h1>🏆 ¡Fin de la partida!</h1><h2>¡${esc(w.name)} gana!</h2>${(S.bonus || []).map(b => `<div class="card">${bonusCard(b)}</div>`).join('')}
    <div class="card">${ranking.map((p, i) => `<div class="pl"><div style="width:28px;font-weight:900">${i + 1}º</div><div class="av" style="border-color:${p.color};background:#fff">${avImg(p)}</div><div class="nm">${esc(p.name)}</div><div class="st">👑 ${p.crowns} · 🪙 ${p.coins}</div></div>`).join('')}</div>
    ${role === 'host' ? '<button class="big" data-act="again">Jugar otra vez</button>' : '<div class="wait">El anfitrión puede iniciar otra partida.</div>'}`;
  return `<div class="hud"><div class="hud-top" style="justify-content:center"><span class="pill" style="font-size:1.2rem">🏆 ¡${esc(w.name)} gana!</span></div>
    <div class="hud-bottom glass" style="max-height:52vh;overflow:auto">
      ${(S.bonus || []).map(b => bonusCard(b)).join('')}
      ${ranking.map((p, i) => `<div class="pl"><div style="width:28px;font-weight:900">${['🥇','🥈','🥉'][i] || (i + 1) + 'º'}</div><div class="av" style="border-color:${p.color};background:#fff">${avImg(p)}</div><div class="nm">${esc(p.name)}</div><div class="st">👑 ${p.crowns} · 🪙 ${p.coins}</div></div>`).join('')}
      ${role === 'host' ? '<button class="big" data-act="again">Jugar otra vez</button>' : '<div class="wait">El anfitrión puede iniciar otra partida.</div>'}
    </div></div>`;
}

/* ================= Minijuegos ================= */
function runMinigame(){
  const m = S.mg, def = MG[m.type], root = $('#mg'), rng = mulberry32(m.seed);
  if (!m.players.includes(myId)) { root.innerHTML = '<div class="card">👀 No juegas este minijuego. ¡Espera el resultado!</div>'; return; }
  if (def.td) { root.innerHTML = '<div class="card">Tu celular no puede mostrar este minijuego 3D 😢<br>Mira la tabla al terminar.</div>';
    send({t:'score', key:m.key, v: def.lower ? 999999 : 0}); return; }
  const timers = []; let finished = false;
  const later = (f, ms) => timers.push(setTimeout(f, ms));
  const every = (f, ms) => timers.push(setInterval(f, ms));
  ui.mgCleanup = () => timers.forEach(t => { clearTimeout(t); clearInterval(t); });
  const t0 = performance.now();
  const left = () => Math.max(0, def.dur - (performance.now() - t0));
  const done = v => {
    if (finished) return; finished = true;
    send({t:'score', key:m.key, v});
    later(() => { if (!root.isConnected) return; timers.forEach(t => { clearTimeout(t); clearInterval(t); }); root.innerHTML = `<div style="font-size:3rem">✅</div><div class="mgname">¡Listo!</div>
      <div class="card">Tu resultado: <b>${fmtScore(m.type, v)}</b></div><div class="note">Esperando a los demás…</div>`; }, 900);
  };
  const header = `<div class="mgname" style="font-size:1.4rem">${def.icon} ${def.name}</div><div class="bar"><div id="tb"></div></div>`;
  const tick = () => { const b = $('#tb'); if (b) b.style.width = (left() / def.dur * 100) + '%'; };
  every(tick, 100);
  const on = (el, f) => el.addEventListener('pointerdown', e => { e.preventDefault(); if (!finished) f(e); });

  if (m.type === 'taps') {
    let n = 0;
    root.innerHTML = header + `<div class="problem" id="n">0</div><button class="tapbtn" id="b">¡TOCA!</button>`;
    on($('#b'), () => { n++; $('#n').textContent = n; });
    later(() => done(n), def.dur);
  }
  else if (m.type === 'reflex') {
    const greenAt = 1500 + rng() * 4000; let green = false, gt = 0;
    root.innerHTML = header + `<div class="reflex" id="r" style="background:#b91c1c">Espera…</div>`;
    const r = $('#r');
    later(() => { if (finished) return; green = true; gt = performance.now(); r.style.background = '#16a34a'; r.textContent = '¡YA!'; }, greenAt);
    on(r, () => { if (!green) { r.textContent = '¡Muy pronto! ❌'; done(9999); } else { const v = Math.round(performance.now() - gt); r.textContent = v + ' ms'; done(v); } });
    later(() => done(9999), def.dur);
  }
  else if (m.type === 'math') {
    let score = 0, locked = false;
    root.innerHTML = header + `<div class="note">Aciertos: <b id="sc">0</b></div><div class="problem" id="p"></div><div class="opts" id="o"></div>`;
    const next = () => {
      const op = rng() < 0.5 ? '+' : '−', a = 2 + Math.floor(rng() * 18), b = 2 + Math.floor(rng() * 9);
      const ans = op === '+' ? a + b : b; // resta: (a+b) − a = b
      const opts = new Set([ans]); while (opts.size < 4) { const d = ans + Math.floor(rng() * 9) - 4; if (d >= 0 && d !== ans) opts.add(d); }
      const arr = [...opts].sort(() => rng() - 0.5);
      $('#p').textContent = op === '+' ? `${a} + ${b}` : `${a + b} − ${a}`;
      $('#o').innerHTML = arr.map(v => `<button data-v="${v}">${v}</button>`).join('');
      $('#o').querySelectorAll('button').forEach(btn => on(btn, () => {
        if (locked) return;
        if (+btn.dataset.v === ans) { score++; $('#sc').textContent = score; next(); }
        else { locked = true; root.classList.add('flash-bad'); btn.style.background = '#ef4444';
          later(() => { locked = false; root.classList.remove('flash-bad'); next(); }, 1000); }
      }));
    };
    next(); later(() => done(score), def.dur);
  }
  else if (m.type === 'clock') {
    root.innerHTML = header + `<div class="note">Objetivo: <b>5.00 s</b></div><div class="problem" id="t">0.00</div><button class="tapbtn" id="b">¡ALTO!</button>`;
    every(() => { if (finished) return; const e = (performance.now() - t0) / 1000; $('#t').textContent = e < 2 ? e.toFixed(2) : '?.??'; }, 30);
    on($('#b'), () => { const e = performance.now() - t0; $('#t').textContent = (e / 1000).toFixed(2); done(Math.round(Math.abs(e - 5000))); });
    later(() => done(9999), def.dur);
  }
  else if (m.type === 'color') {
    const C = [['ROJO', '#ef4444'], ['AZUL', '#3b82f6'], ['VERDE', '#22c55e'], ['AMARILLO', '#facc15']];
    let score = 0, locked = false;
    root.innerHTML = header + `<div class="note">Aciertos: <b id="sc">0</b></div>
      <div class="problem" id="w" style="background:#fff;border-radius:16px;padding:10px 18px"></div><div class="opts" id="o"></div>`;
    const next = () => {
      const word = Math.floor(rng() * 4); let ink = Math.floor(rng() * 4); if (rng() < 0.75 && ink === word) ink = (ink + 1 + Math.floor(rng() * 3)) % 4;
      const w = $('#w'); w.textContent = C[word][0]; w.style.color = C[ink][1];
      const order = [0, 1, 2, 3].sort(() => rng() - 0.5);
      $('#o').innerHTML = order.map(i => `<button class="sec" data-v="${i}" style="font-size:1.1rem">${C[i][0]}</button>`).join('');
      $('#o').querySelectorAll('button').forEach(btn => on(btn, () => {
        if (locked) return;
        if (+btn.dataset.v === ink) { score++; $('#sc').textContent = score; next(); }
        else { locked = true; root.classList.add('flash-bad'); btn.style.background = '#ef4444';
          later(() => { locked = false; root.classList.remove('flash-bad'); next(); }, 1000); }
      }));
    };
    next(); later(() => done(score), def.dur);
  }
  else if (m.type === 'balloon') {
    const limit = 10 + Math.floor(rng() * 25); let n = 0;
    root.innerHTML = header + `<div class="note">Bombeos: <b id="n">0</b></div>
      <div style="height:240px;display:grid;place-items:center"><div class="balloon" id="bl" style="width:60px;height:70px"></div></div>
      <div class="row" style="width:100%"><button class="big" id="pump">💨 Inflar</button><button class="big sec" id="save">💾 Guardar</button></div>`;
    on($('#pump'), () => {
      n++; $('#n').textContent = n; const sz = 60 + n * 5; const bl = $('#bl'); bl.style.width = sz + 'px'; bl.style.height = sz * 1.15 + 'px';
      if (n >= limit) { bl.outerHTML = '<div style="font-size:6rem">💥</div>'; done(0); }
    });
    on($('#save'), () => done(n));
    later(() => done(n), def.dur);
  }
}

/* ================= Eventos ================= */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'emoji') { me.emoji = b.dataset.v; ls.set('femoji', me.emoji);
    document.querySelectorAll('.chars button').forEach(x => x.classList.toggle('sel', x === b)); }
  else if (act === 'pref') { const k = b.dataset.k; prefs[k] = !prefs[k]; ls.set(k === 'sound' ? 'fsound' : 'flow', prefs[k] ? '1' : '0');
    if (k === 'low' && window.Board3D && Board3D.ok) Board3D.setLow(prefs.low); if (k === 'sound' && window.SFX) SFX.enable(prefs.sound); render(); }
  else if (act === 'botlvl') { ui.botLvl = b.dataset.v; render(); }
  else if (act === 'addbot') send({t:'addbot', lvl: ui.botLvl || 'normal'});
  else if (act === 'delbot') send({t:'delbot', id: b.dataset.v});
  else if (act === 'create' || act === 'join' || act === 'solo') {
    me.name = ($('#name').value || '').trim().slice(0, 12);
    if (!me.name) { ui.error = 'Escribe tu nombre primero'; render(); return; }
    ls.set('fname', me.name);
    if (act === 'create') startHost();
    else if (act === 'solo') startHost(true);
    else { const code = ($('#code').value || '').trim().toUpperCase();
      if (!/^[A-Z]{4}$/.test(code)) { ui.error = 'El código tiene 4 letras'; ui.code = code; render(); return; }
      startClient(code); }
  }
  else if (act === 'share') {
    const url = (APP ? WEB_URL : location.origin + location.pathname) + '?sala=' + S.code + (LOCAL ? '&local' : '');
    const text = `¡Únete a mi partida de Fiesta Tablero! Código: ${S.code}`;
    if (APP) APP.share(text + '\n' + url);
    else if (navigator.share) { try { await navigator.share({title:'Fiesta Tablero', text, url}); } catch(err){} }
    else { try { await navigator.clipboard.writeText(text + ' ' + url); b.textContent = '✅ Enlace copiado'; } catch(err){ prompt('Copia este enlace:', url); } }
  }
  else if (act === 'rounds') send({t:'rounds', n:+b.dataset.v});
  else if (act === 'theme') send({t:'theme', v:b.dataset.v});
  else if (act === 'fast') send({t:'fast', v:b.dataset.v === '1'});
  else if (act === 'use') { send({t:'use', item:b.dataset.v}); }
  else if (act === 'buy') { b.parentNode.querySelectorAll('button').forEach(x => x.disabled = true); send({t:'buy', item:b.dataset.v}); }
  else if (act === 'fork') { b.parentNode.querySelectorAll('button').forEach(x => x.disabled = true); send({t:'fork', to:+b.dataset.v}); }
  else if (act === 'duel') { b.parentNode.querySelectorAll('button').forEach(x => x.disabled = true); send({t:'duel', id:b.dataset.v}); }
  else if (act === 'view') { ui.cam = Board3D.toggleView(); b.textContent = ui.cam === 'overview' ? '🎥' : '🗺️'; }
  else if (act === 'start') send({t:'start'});
  else if (act === 'roll') { b.disabled = true; myRoll(); }
  else if (act === 'buy' || act === 'nobuy') { b.parentNode.querySelectorAll('button').forEach(x => x.disabled = true); send({t:'crown', buy: act === 'buy'}); }
  else if (act === 'again') send({t:'again'});
  else if (act === 'reconnect') { setBanner('Reconectando…'); startClient(ui.code); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'name') me.name = e.target.value;
  if (e.target.id === 'code') { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z]/g, ''); ui.code = e.target.value; }
});

/* Mantener la pantalla encendida durante la partida */
let wakeLock = null;
async function keepAwake(){ try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch(e){} }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S && S.phase !== 'lobby') keepAwake();
  if (document.visibilityState === 'visible' && role === 'client' && net.conn && net.conn.open === false) lost();
});
window.addEventListener('beforeunload', e => { if (role === 'host' && S && S.phase !== 'lobby' && S.phase !== 'end') { e.preventDefault(); e.returnValue = ''; } });

if (window.SFX) SFX.enable(prefs.sound);
window.addEventListener('board3d-ready', () => { if (window.Board3D.ok) { Board3D.preload(CHARS.map(c => c.id)); Board3D.setLow(prefs.low); } if (S) { ui.viewKey = null; onState(S); } });
if (typeof Peer === 'undefined' && !LOCAL) ui.error = 'No se pudo cargar el módulo de conexión. Revisa tu internet y recarga.';
// Si veníamos de una partida como invitado (recarga de página), reconectar automáticamente
const prevCode = ss.get('fcode');
if (prevCode && me.name) startClient(prevCode); else render();
</script>
