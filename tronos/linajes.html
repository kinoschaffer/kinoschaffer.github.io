<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>2048</title>
<style>
:root{--bg:#0d0b09;--stone:#2a241e;--stone2:#3a3128;--gold:#c9a44c;--gold2:#f0d58a;--ink:#eadfc8;--muted:#a89880}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse at top,#2b2118 0%,var(--bg) 70%);color:var(--ink);font-family:'EB Garamond',Georgia,serif;
  display:flex;justify-content:center;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
.wrap{width:100%;max-width:480px;padding:8px 16px 20px}
.top{display:flex;justify-content:space-between;align-items:center}
.back{white-space:nowrap;font-family:Cinzel,serif;color:var(--gold);text-decoration:none;font-size:14px;letter-spacing:1px;padding:4px 0}
h1{font-family:Cinzel,serif;font-weight:900;margin:0;font-size:clamp(22px,6vw,30px);letter-spacing:3px;
  background:linear-gradient(#f6e3a6,#b8892f);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:var(--muted);font-style:italic;margin:2px 0 8px;font-size:15px}
.hud{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.panel{background:linear-gradient(var(--stone2),var(--stone));border:2px solid #5a4a36;border-radius:8px;padding:4px;text-align:center}
.lbl{font-family:Cinzel,serif;font-size:11px;letter-spacing:2px;color:var(--gold)}
.val{font-family:Cinzel,serif;font-size:24px;font-weight:700;color:var(--gold2)}
.frame{padding:8px;border-radius:10px;background:linear-gradient(135deg,#6b5332,#3b2d1c 40%,#7a5e36 60%,#3b2d1c);box-shadow:0 10px 30px rgba(0,0,0,.7)}
.board{position:relative;aspect-ratio:1;background:#0a0806;border-radius:6px;touch-action:none}
.slot,.tile{position:absolute;width:calc((100% - 5*var(--g))/4);height:calc((100% - 5*var(--g))/4);border-radius:8px}
.board{--g:8px}
.slot{background:linear-gradient(145deg,#231d17,#1b1713);box-shadow:inset 0 -2px 3px rgba(0,0,0,.5)}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .11s ease-in-out;z-index:2;
  border:2px solid rgba(240,213,138,.5);box-shadow:0 3px 6px rgba(0,0,0,.6),inset 0 -4px 8px rgba(0,0,0,.3)}
.tile .num{font-weight:bold;line-height:1}
.tile .ic{font-size:clamp(22px,8vw,38px);line-height:1}
.tile .nm{font-weight:700;font-size:clamp(9px,2.6vw,12px);margin-top:2px;text-shadow:0 1px 2px #000;white-space:nowrap}
.tile .nu{font-size:clamp(9px,2.4vw,11px)}
.tile.new .in{animation:pop .18s ease-out}
.tile.merged .in{animation:bump .2s ease-out}
.in{display:flex;flex-direction:column;align-items:center}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes bump{50%{transform:scale(1.25)}}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(3,58px);gap:6px;justify-content:center;margin-top:12px}
button{font-family:Cinzel,serif;font-weight:700;font-size:13px;letter-spacing:1px;color:var(--gold2);cursor:pointer;touch-action:manipulation;
  background:linear-gradient(#4a3c2c,#2a221a);border:2px solid #7a6240;border-radius:10px;padding:8px 12px;box-shadow:0 3px 0 #120d08}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #120d08}
button:disabled{opacity:.4}
.pad button{font-size:24px;padding:0}
.bar{display:flex;gap:8px;justify-content:center;margin-top:12px}
.ranks{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:4px 10px;margin-top:14px;font-size:14px;color:var(--muted)}
.ranks b{color:var(--ink)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.overlay.show{display:flex}
.modal{background:linear-gradient(var(--stone2),var(--stone));border:3px solid var(--gold);border-radius:12px;padding:22px;max-width:340px;width:100%;text-align:center}
.modal h2{font-family:Cinzel,serif;color:var(--gold2);margin:0 0 8px}
.modal .bar{margin-top:16px}
</style>
<link rel="stylesheet" href="win98.css">
</head>
<body data-icon="🟦">
<div class="wrap">
  <div class="top"><a class="back" href="index.html">← Menú</a><h1>LINAJES</h1><span style="width:50px"></span></div>
  <div class="sub">Une nobles del mismo rango hasta alcanzar el Trono</div>
  <div class="hud">
    <div class="panel"><div class="lbl">GLORIA</div><div class="val" id="score">0</div></div>
    <div class="panel"><div class="lbl">RÉCORD</div><div class="val" id="best">0</div></div>
  </div>
  <div class="frame"><div class="board" id="board"></div></div>
  <div class="pad">
    <span></span><button data-d="0">▲</button><span></span>
    <button data-d="3">◀</button><span></span><button data-d="1">▶</button>
    <span></span><button data-d="2">▼</button><span></span>
  </div>
  <div class="bar"><button id="btnNew">Nueva partida</button><button id="btnUndo">↶ Deshacer</button></div>
  
</div>
<div class="overlay" id="over"><div class="modal">
  <h2 id="ovT"></h2><div id="ovP"></div>
  <div class="bar"><button id="ovNew">Nueva partida</button><button id="ovCont">Seguir</button></div>
</div></div>
<script>
(()=>{
const N=4;
const RANKS=[null,
 ['🌾','Campesino','#c0c0c0'],['🛡️','Escudero','#ffff80'],['🗡️','Soldado','#808000'],['🐴','Caballero','#800000'],
 ['🏰','Barón','#ff8040'],['🦅','Conde','#008000'],['🦁','Duque','#000080'],['⚜️','Príncipe','#00ffff'],
 ['👑','Rey','#800080'],['🐉','Emperador','#ffff00'],['🏆','EL TRONO','#ff0000'],['🌟','Leyenda','#ffffff']];
const $=id=>document.getElementById(id), board=$('board');
function load(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let grid,score,best=load('lj_best',0),hist=null,won=false,nid=1,busy=false;
const tiles=new Map(); // id -> element

for(let r=0;r<N;r++)for(let c=0;c<N;c++){const s=document.createElement('div');s.className='slot';s.style.transform=tr(r,c);board.appendChild(s);}
function tr(r,c){return `translate(calc(var(--g) + ${c} * (100% + var(--g))), calc(var(--g) + ${r} * (100% + var(--g))))`}
function lvlInfo(l){return RANKS[Math.min(l,RANKS.length-1)]}
function tileEl(t,cls){
  const el=document.createElement('div');const [ic,nm,col]=lvlInfo(t.l);
  el.className='tile '+(cls||'');el.style.background=col;const dark=[3,4,6,7,8,10].includes(Math.min(t.l,12));el.style.color=dark?'#fff':'#000';
  const v=2**t.l;el.innerHTML=`<div class="in"><div class="num" style="font-size:${v<100?'clamp(28px,10vw,46px)':v<1000?'clamp(24px,8.5vw,40px)':'clamp(18px,6.5vw,32px)'}">${v}</div></div>`;
  el.style.transform=tr(t.r,t.c);board.appendChild(el);tiles.set(t.id,el);return el;
}
function empties(){const e=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!grid[r][c])e.push([r,c]);return e}
function spawn(){const e=empties();if(!e.length)return;const [r,c]=e[Math.floor(Math.random()*e.length)];
  const t={id:nid++,l:Math.random()<0.9?1:2,r,c};grid[r][c]=t;tileEl(t,'new');}
function snapshot(){return {g:grid.map(row=>row.map(t=>t&&{...t})),score,won}}
function rebuild(){tiles.forEach(el=>el.remove());tiles.clear();grid.forEach(row=>row.forEach(t=>t&&tileEl(t)));}
function hud(){if(score>best){best=score;save('lj_best',best)}$('score').textContent=score;$('best').textContent=best;$('btnUndo').disabled=!hist;}

function move(d){
  if(busy||$('over').classList.contains('show'))return;
  const before=snapshot();let moved=false,gained=0;const removed=[],merged=[];
  const vec=[[-1,0],[0,1],[1,0],[0,-1]][d];
  const order=[...Array(N).keys()]; if(vec[0]===1||vec[1]===1)order.reverse();
  const mergedFlag=new Set();
  // iterate cells in travel order
  const all=[...Array(N).keys()],cells=[];for(const r of (vec[0]!==0?order:all))for(const c of (vec[1]!==0?order:all))cells.push([r,c]);
  for(const [r,c] of cells){const t=grid[r][c];if(!t)continue;
    let nr=r,nc=c;
    while(true){const tr_=nr+vec[0],tc=nc+vec[1];if(tr_<0||tr_>=N||tc<0||tc>=N)break;
      const o=grid[tr_][tc];
      if(!o){nr=tr_;nc=tc;continue;}
      if(o.l===t.l&&!mergedFlag.has(o.id)){ // merge
        grid[r][c]=null;o.l++;mergedFlag.add(o.id);gained+=2**o.l;
        t.r=tr_;t.c=tc;removed.push(t);merged.push(o);moved=true;nr=null;break;}
      break;}
    if(nr===null)continue;
    if(nr!==r||nc!==c){grid[r][c]=null;grid[nr][nc]=t;t.r=nr;t.c=nc;moved=true;}
  }
  if(!moved)return;
  hist=before;busy=true;score+=gained;
  grid.forEach(row=>row.forEach(t=>{if(t)tiles.get(t.id).style.transform=tr(t.r,t.c)}));
  removed.forEach(t=>{const el=tiles.get(t.id);el.style.transform=tr(t.r,t.c);el.style.zIndex=1;});
  if(gained)beep(300+Math.min(merged.reduce((a,t)=>Math.max(a,t.l),0),12)*60,.1);
  setTimeout(()=>{
    removed.forEach(t=>{tiles.get(t.id).remove();tiles.delete(t.id)});
    merged.forEach(t=>{tiles.get(t.id).remove();tiles.delete(t.id);tileEl(t,'merged')});
    spawn();busy=false;hud();
    if(!won&&grid.some(row=>row.some(t=>t&&t.l>=11))){won=true;show('🏆 ¡Has alcanzado el Trono!',`Gloria: <b>${score}</b><br>Puedes seguir hasta convertirte en Leyenda.`,true);}
    else if(!canMove())show('El linaje se ha extinguido',`Gloria final: <b>${score}</b>`,false);
  },120);
}
function canMove(){if(empties().length)return true;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const l=grid[r][c].l;if((c<N-1&&grid[r][c+1].l===l)||(r<N-1&&grid[r+1][c].l===l))return true;}return false}
function show(t,p,cont){$('ovT').textContent=t;$('ovP').innerHTML=p;$('ovCont').style.display=cont?'':'none';$('over').classList.add('show');}
function newGame(){grid=[...Array(N)].map(()=>Array(N).fill(null));score=0;hist=null;won=false;rebuild();spawn();spawn();hud();}
$('ovNew').onclick=()=>{$('over').classList.remove('show');newGame()};
$('ovCont').onclick=()=>$('over').classList.remove('show');
$('btnNew').onclick=()=>{if(score>0&&!confirm('¿Abandonar esta partida?'))return;newGame()};
$('btnUndo').onclick=()=>{if(!hist||busy)return;grid=hist.g;score=hist.score;won=hist.won;hist=null;rebuild();hud();};
document.querySelectorAll('.pad button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();move(+b.dataset.d)}));
window.addEventListener('keydown',e=>{const m={ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3}[e.key];if(m!=null){e.preventDefault();move(m)}});
let sx,sy;board.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
board.addEventListener('pointerup',e=>{if(sx==null)return;const dx=e.clientX-sx,dy=e.clientY-sy;sx=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0));});
let ac,sound=load('lt_sound',true);
function beep(f,d){if(!sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
  o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d);}catch(e){}}
newGame();
})();
</script>
<script src="win98.js"></script>
</body>
</html>
